{% extends "base.html" %}

{% block title %}Register | Safety Arrival Notifier{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Create account</h1>

    <p>Set up your profile and trusted contact.</p>

    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="post">

        <label>
            Name
            <input
                name="name"
                required
            >
        </label>

        <label>
            Email
            <input
                type="email"
                name="email"
                required
            >
        </label>

        <label>
            Password
            <input
                type="password"
                name="password"
                minlength="6"
                required
            >
        </label>

        <label>
            Your phone <span class="muted">(optional)</span>
            <input
                name="phone"
                type="tel"
                maxlength="10"
                minlength="10"
                pattern="[0-9]{10}"
                inputmode="numeric"
                title="Enter exactly 10 digits"
                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
            >
        </label>

        <hr>

        <h3>Trusted contact</h3>

        <label>
            Trusted contact name
            <input
                name="trusted_name"
            >
        </label>

        <label>
            Trusted contact phone
            <input
                name="trusted_phone"
                type="tel"
                maxlength="10"
                minlength="10"
                pattern="[0-9]{10}"
                inputmode="numeric"
                title="Enter exactly 10 digits"
                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
            >
        </label>

        <button
            class="btn primary full"
            type="submit"
        >
            Create account
        </button>

    </form>

</div>

{% endblock %}
